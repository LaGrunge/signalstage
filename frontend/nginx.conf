# Port 80 exists only to answer Let's Encrypt HTTP-01 challenges and to
# bounce everything else to https. No Basic Auth here: the ACME path must be
# reachable anonymously, and the redirect leaks nothing. The redirect targets
# the canonical domain (not $host) so old http://<ip>/room/... links land on
# the URL the certificate is actually valid for.
server {
    listen 80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://signalstage.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name signalstage.duckdns.org;

    # Issued by the certbot compose service (docker-compose.yml), renewed via
    # the webroot above; the wrapper command on the frontend service reloads
    # nginx periodically so renewed certs get picked up.
    ssl_certificate /etc/letsencrypt/live/signalstage.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalstage.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Gatekeeper for the interviewer surface, independent of the app's own
    # JWT auth - this box faces the public internet. Inherited by every
    # location that doesn't opt out with "auth_basic off;" below: page load,
    # login/register, and the interviewer APIs stay behind it. Browsers
    # cache Basic Auth credentials per-origin after the first prompt and
    # replay them automatically on same-origin fetch/websocket requests,
    # so the app itself needs no changes (and interviewers harmlessly send
    # the creds on the exempt candidate paths too).
    auth_basic "SignalStage";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ---- Candidate-accessible without Basic Auth ------------------------
    # A candidate gets only the room link (/room/<uuid>), never the Basic
    # Auth password. App-layer auth still applies on everything exempted
    # here: the room UUID is the bearer secret; mutating /rooms/:id routes
    # are JWT-protected; /execute and /rooms/:id/tests are gated per-room
    # by the run/tests toggles.

    # Room page: serve the SPA shell directly IN this location. Do not use
    # "try_files $uri /index.html" here - the fallback param does an
    # internal redirect that re-matches "location /", where auth_basic is
    # back on.
    location /room/ {
        auth_basic off;
        try_files /index.html =404;
    }

    # Hashed vite bundles + favicon - no secrets in the static build.
    location /assets/ {
        auth_basic off;
    }
    location = /favicon.ico {
        auth_basic off;
    }
    # The Room page header logo (Room.jsx). Leaving it gated makes the
    # browser pop a Basic Auth dialog at the candidate on an otherwise
    # exempt page (and the logo 401s away).
    location = /SignalStageNoTitle.png {
        auth_basic off;
    }

    # NOTE trailing slash: bare /api/rooms (POST create, GET list) stays
    # behind Basic Auth via the exact-match block right below.
    location /api/rooms/ {
        auth_basic off;
        proxy_pass http://api:4000/rooms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Exact match for bare /api/rooms, still behind Basic Auth (inherited).
    # Without this, nginx's prefix location "/api/rooms/" above auto-301s
    # a bare /api/rooms to add the slash - skipping Basic Auth AND turning
    # the dashboard's POST /api/rooms (create room) into a GET, since
    # browsers rewrite the method on a 301.
    location = /api/rooms {
        proxy_pass http://api:4000/rooms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/languages {
        auth_basic off;
        proxy_pass http://api:4000/languages;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/execute {
        auth_basic off;
        proxy_pass http://api:4000/execute;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # ---------------------------------------------------------------------

    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # No trailing slash: @hocuspocus/provider connects to exactly "/collab"
    # (it does not append the room name to the path - that's negotiated over
    # the websocket protocol itself, via the `name`/`token` provider options).
    # A location ending in "/" only matches "/collab/..." and nginx 301s a
    # bare "/collab" request to add the slash - which breaks the websocket
    # upgrade handshake and makes the client spin in "connecting" forever.
    location /collab {
        # Candidate-accessible: Hocuspocus itself validates that the room
        # exists and is active in onAuthenticate (server/src/collabServer.js).
        auth_basic off;
        proxy_pass http://api:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Same no-trailing-slash reasoning as /collab above, applied preemptively:
    # the frontend always requests /lsp/<language> (never a bare /lsp), but
    # keep the pattern consistent so a bare /lsp request doesn't 301 instead
    # of 404ing cleanly.
    location /lsp {
        # Candidate-accessible. Known gap: the lsp bridge has no app-layer
        # auth of its own yet, so this is open to anyone who finds the box.
        # Accepted for now (isolated VPC, mem-limited container, fixed
        # language allowlist); follow-up is a ?room=<uuid> check in
        # lsp/bridge.js.
        auth_basic off;
        proxy_pass http://lsp:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: client-side routing (react-router) owns everything else.
    location / {
        try_files $uri /index.html;
    }
}
